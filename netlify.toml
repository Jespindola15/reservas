# Configuración de Netlify para TURNUP (Next.js 16).
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # Telemetría de Next desactivada en el build.
  NEXT_TELEMETRY_DISABLED = "1"

# El vencimiento de solicitudes PENDING en serverless no puede depender de un
# temporizador en memoria: lo dispara la función programada netlify/functions/expire-pending.mts.
